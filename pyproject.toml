[project]
name = "radar"
version = "0.1.0"
description = "Personal investment research radar."
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.scripts]
radar = "radar.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
